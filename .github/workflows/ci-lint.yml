name: NetDevOps CI - YAML & Ansible Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint YAML and Ansible Playbooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linters and Ansible collections
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint yamllint netaddr jmespath
          ansible-galaxy collection install netbox.netbox cisco.ios ansible.netcommon

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint (if playbooks exist)
        run: |
          if ls playbooks/*.yml 1> /dev/null 2>&1; then
            ansible-lint playbooks/
          else
            echo "No playbooks found yet. Skipping ansible-lint."
          fi
