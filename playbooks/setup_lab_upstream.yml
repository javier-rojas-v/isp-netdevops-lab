---
- name: Provision Simulated Tier-1 Upstream Peer (Lab Infrastructure Only)
  hosts: CSR-EDGE-01
  gather_facts: false
  vars:
    ansible_connection: ansible.netcommon.network_cli

  tasks:
    - name: Configure UPSTREAM-TIER1 VRF and simulated external eBGP peer
      cisco.ios.ios_config:
        lines:
          - rd 64512:100
          - address-family ipv4
        parents: vrf definition UPSTREAM-TIER1

    - name: Configure VRF Loopback100 and GigabitEthernet4
      cisco.ios.ios_config:
        lines:
          - vrf forwarding UPSTREAM-TIER1
          - ip address 198.51.100.1 255.255.255.255
        parents: interface Loopback100

    - name: Configure GigabitEthernet4 peering interface
      cisco.ios.ios_config:
        lines:
          - vrf forwarding UPSTREAM-TIER1
          - ip address 203.0.113.0 255.255.255.254
          - no shutdown
        parents: interface GigabitEthernet4

    - name: Configure eBGP neighbor inside UPSTREAM-TIER1 VRF
      cisco.ios.ios_config:
        lines:
          - bgp router-id 198.51.100.1
          - neighbor 203.0.113.1 remote-as 65001
          - neighbor 203.0.113.1 local-as 64512 no-prepend replace-as
          - neighbor 203.0.113.1 activate
        parents:
          - router bgp 65001
          - address-family ipv4 vrf UPSTREAM-TIER1
