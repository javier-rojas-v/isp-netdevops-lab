[defaults]
inventory = inventory/netbox_inv.yml
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml

[inventory]
enable_plugins = netbox.netbox.nb_inventory, yaml, ini

[persistent_connection]
connect_timeout = 30
command_timeout = 30

[netconf_connection]
netconf_ssh_config = True
