plugin: netbox.netbox.nb_inventory
validate_certs: false

group_by:
  - device_roles
  - sites

query_filters:
  - status: active

compose:
  ansible_host: primary_ip4.split('/')[0]
  ansible_network_os: "'cisco.ios.ios'"
  ansible_connection: "'ansible.netcommon.netconf'"
  ansible_port: 830
  ansible_user: lookup('env', 'ROUTER_USER')
  ansible_password: lookup('env', 'ROUTER_PASS')
